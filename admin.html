<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Mantenedor de Productos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Mantenedor de Productos</h1>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" href="index.html"><i class="fa-solid fa-shop me-2"></i>Tienda</a>
                <a class="btn btn-primary" href="producto.html"><i class="fa-solid fa-plus me-2"></i>Nuevo producto</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 70px;">ID</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Precio</th>
                                <th>Categoría</th>
                                <th style="width: 100px;">Stock</th>
                                <th style="width: 120px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyProductos">
                        <!-- filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <p class="text-muted mt-3">* Los cambios se guardan en <code>localStorage</code>.</p>
    </div>

    <script src="assets/js/admin.js"></script>
</body>
</html>
