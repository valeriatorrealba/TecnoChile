<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Producto | Crear/Editar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 id="titulo" class="h3 mb-0">Nuevo producto</h1>
            <a class="btn btn-outline-secondary" href="admin.html"><i class="fa-solid fa-arrow-left me-2"></i>Volver</a>
        </div>

        <form id="formProducto" class="card p-3">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Precio (CLP)</label>
                    <input type="number" id="precio" class="form-control" min="0" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Descripción</label>
                    <textarea id="descripcion" class="form-control" rows="2"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Categoría</label>
                    <select id="categoria" class="form-select" required>
                        <option value="">Selecciona...</option>
                        <option>Laptops</option>
                        <option>Smartphones</option>
                        <option>Tablets</option>
                        <option>Accesorios</option>
                        <option>Sin categoría</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Etiqueta(s) (opcional)</label>
                    <input type="text" id="etiqueta" class="form-control" placeholder="Apple, Android, etc.">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Stock</label>
                    <input type="number" id="stock" class="form-control" min="0" value="0" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">URL de imagen</label>
                    <input type="text" id="imagen" class="form-control" placeholder="assets/image/img1.png">
                </div>
            </div>

            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk me-2"></i>Guardar</button>
                <a class="btn btn-outline-secondary" href="admin.html">Cancelar</a>
            </div>
        </form>
    </div>

    <script src="assets/js/producto.js"></script>
</body>
</html>
